<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b12">
    <title>هندسة صوتية | لوحة الإدارة</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-brand">
            <div class="admin-brand-icon">
                <i class="fa-solid fa-wave-square"></i>
            </div>
            <div>
                <strong style="display:block;font-size:15px;">هندسة صوتية</strong>
                <span style="color:#667182;font-size:10px;">ADMIN CENTER</span>
            </div>
        </div>

        <nav class="admin-nav">
            <button class="active" data-section="dashboard">
                <i class="fa-solid fa-gauge-high"></i>
                <span>لوحة التحكم</span>
            </button>
            <button data-section="users">
                <i class="fa-solid fa-users"></i>
                <span>المستخدمون</span>
            </button>
            <button data-section="registrations">
                <i class="fa-solid fa-user-plus"></i>
                <span>التسجيلات</span>
            </button>
            <button data-section="projects">
                <i class="fa-solid fa-diagram-project"></i>
                <span>المشاريع</span>
            </button>
            <button data-section="activity">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>سجل النشاط</span>
            </button>
        </nav>

        <div style="padding:15px;border-top:1px solid rgba(255,255,255,.08);">
            <button id="backToAppBtn" style="width:100%;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#a8b2c0;font-size:11px;cursor:pointer;">
                <i class="fa-solid fa-arrow-right"></i> العودة للتطبيق
            </button>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-topbar">
            <div>
                <h1 id="pageTitle">لوحة التحكم</h1>
                <p id="pageSubtitle">إدارة منصة هندسة صوتية</p>
            </div>
            <div style="display:flex;gap:8px;">
                <button id="refreshBtn" style="height:38px;padding:0 14px;border-radius:9px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#a8b2c0;cursor:pointer;font-size:11px;">
                    <i class="fa-solid fa-rotate"></i> تحديث
                </button>
                <button id="logoutBtn" style="height:38px;padding:0 14px;border-radius:9px;border:1px solid rgba(230,0,18,.25);background:rgba(230,0,18,.08);color:#ff7883;cursor:pointer;font-size:11px;">
                    <i class="fa-solid fa-right-from-bracket"></i> خروج
                </button>
            </div>
        </header>

        <!-- Dashboard -->
        <section id="section-dashboard" class="admin-section active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">المستخدمون</div>
                    <div class="stat-value" id="statUsers">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">المشاريع</div>
                    <div class="stat-value" id="statProjects">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">التسجيلات</div>
                    <div class="stat-value" id="statRegistrations">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">الوضع الحالي</div>
                    <div class="stat-value" id="statMode" style="font-size:16px;">—</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h3 style="margin:0;font-size:14px;">
                        <i class="fa-solid fa-users" style="color:#38bdf8;"></i>
                        أحدث المستخدمين
                    </h3>
                </div>
                <div class="panel-body" id="recentUsers"></div>
            </div>
        </section>

        <!-- Users -->
        <section id="section-users" class="admin-section" style="display:none;">
            <div class="panel">
                <div class="panel-header">
                    <h3 style="margin:0;font-size:14px;">
                        <i class="fa-solid fa-users" style="color:#38bdf8;"></i>
                        إدارة المستخدمين
                    </h3>
                </div>
                <div class="panel-body">
                    <div id="usersTable"></div>
                </div>
            </div>
        </section>

        <!-- Registrations -->
        <section id="section-registrations" class="admin-section" style="display:none;">
            <div class="panel">
                <div class="panel-header">
                    <h3 style="margin:0;font-size:14px;">
                        <i class="fa-solid fa-user-plus" style="color:#a78bfa;"></i>
                        سجلات التسجيل
                    </h3>
                </div>
                <div class="panel-body">
                    <div id="registrationsTable"></div>
                </div>
            </div>
        </section>

        <!-- Projects -->
        <section id="section-projects" class="admin-section" style="display:none;">
            <div class="panel">
                <div class="panel-header">
                    <h3 style="margin:0;font-size:14px;">
                        <i class="fa-solid fa-diagram-project" style="color:#22c55e;"></i>
                        المشاريع
                    </h3>
                </div>
                <div class="panel-body">
                    <div id="projectsTable"></div>
                </div>
            </div>
        </section>

        <!-- Activity -->
        <section id="section-activity" class="admin-section" style="display:none;">
            <div class="panel">
                <div class="panel-header">
                    <h3 style="margin:0;font-size:14px;">
                        <i class="fa-solid fa-clock-rotate-left" style="color:#f59e0b;"></i>
                        سجل النشاط
                    </h3>
                </div>
                <div class="panel-body">
                    <div id="activityList"></div>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/firebase.js"></script>
<script src="js/backend.js"></script>
<script src="js/auth.js"></script>
<script src="js/storage.js"></script>

<script>
(function () {
    "use strict";

    const byId = (id) => document.getElementById(id);
    const Backend = window.AcousticEngineering?.backend || window.AcousticBackend;
    const Auth = window.AcousticEngineering?.auth || window.AcousticAuth;
    const Firebase = window.AcousticEngineering?.firebase || window.AcousticFirebase;

    const state = {
        users: [], projects: [], registrations: [], activity: [],
        currentSection: "dashboard"
    };

    function escapeHTML(v) {
        return String(v ?? "")
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDate(v) {
        if (!v) return "—";
        try {
            const d = new Date(v);
            if (isNaN(d.getTime())) return "—";
            return d.toLocaleString("ar", {
                year: "numeric", month: "short", day: "numeric",
                hour: "2-digit", minute: "2-digit"
            });
        } catch { return "—"; }
    }

    function toast(msg, type = "info") {
        const el = document.createElement("div");
        el.style.cssText = `
            position:fixed;left:20px;bottom:20px;z-index:9999;
            background:#111821;color:#fff;padding:12px 18px;
            border-radius:10px;border:1px solid rgba(255,255,255,.1);
            font-family:Cairo,sans-serif;font-size:12px;
            box-shadow:0 15px 40px rgba(0,0,0,.4);
        `;
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3500);
    }

    /* ===== Load Data ===== */
    async function loadData() {
        const mode = Backend?.getMode() || "local";
        byId("statMode").textContent = Backend?.getModeLabel() || mode;

        try {
            if (mode === "firebase" && Firebase) {
                const [usersRes, projectsRes, regsRes, activityRes] = await Promise.all([
                    Firebase.get("users").catch(() => ({ data: null })),
                    Firebase.get("projects").catch(() => ({ data: null })),
                    Firebase.get("registrations").catch(() => ({ data: null })),
                    Firebase.get("activity").catch(() => ({ data: null }))
                ]);

                state.users = objToArray(usersRes.data);
                state.projects = objToArray(projectsRes.data);
                state.registrations = objToArray(regsRes.data);
                state.activity = objToArray(activityRes.data);
            } else if (mode === "server" && window.AcousticAPI) {
                const api = window.AcousticAPI;
                const [usersRes, projectsRes] = await Promise.all([
                    api.request("/projects/all").catch(() => ({ projects: [] })),
                    api.projects.listAll().catch(() => ({ projects: [] }))
                ]);

                state.users = [];
                state.projects = projectsRes.projects || [];
                state.registrations = [];
                state.activity = [];
            } else {
                // Local mode
                state.users = [];
                state.projects = await (Backend?.projects.list() || Promise.resolve([]));
                state.registrations = [];
                state.activity = [];
            }
        } catch (error) {
            console.error("Load error:", error);
        }

        updateStats();
        renderRecentUsers();
        renderUsers();
        renderRegistrations();
        renderProjects();
        renderActivity();
    }

    function objToArray(obj) {
        if (!obj) return [];
        if (Array.isArray(obj)) return obj;
        return Object.keys(obj).map(k => ({ id: k, ...obj[k] }));
    }

    function updateStats() {
        byId("statUsers").textContent = state.users.length;
        byId("statProjects").textContent = state.projects.length;
        byId("statRegistrations").textContent = state.registrations.length;
    }

    function renderRecentUsers() {
        const container = byId("recentUsers");
        if (!state.users.length) {
            container.innerHTML = `<div style="padding:25px;text-align:center;color:#667182;">لا يوجد مستخدمون</div>`;
            return;
        }

        const recent = [...state.users]
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
            .slice(0, 5);

        container.innerHTML = `
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>المستخدم</th>
                        <th>الدور</th>
                        <th>تاريخ التسجيل</th>
                    </tr>
                </thead>
                <tbody>
                    ${recent.map(u => `
                        <tr>
                            <td>
                                <strong style="color:#fff;">${escapeHTML(u.name || u.displayName || "بدون اسم")}</strong>
                                <br>
                                <small style="color:#667182;direction:ltr;display:inline-block;">${escapeHTML(u.email || "")}</small>
                            </td>
                            <td>
                                <span class="badge ${escapeHTML(u.role || "user")}">
                                    ${escapeHTML(roleLabel(u.role))}
                                </span>
                            </td>
                            <td>${escapeHTML(formatDate(u.createdAt))}</td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        `;
    }

    function renderUsers() {
        const container = byId("usersTable");
        if (!state.users.length) {
            container.innerHTML = `<div style="padding:25px;text-align:center;color:#667182;">لا يوجد مستخدمون</div>`;
            return;
        }

        container.innerHTML = `
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الاسم</th>
                        <th>البريد / الهاتف</th>
                        <th>الدور</th>
                        <th>تاريخ التسجيل</th>
                    </tr>
                </thead>
                <tbody>
                    ${state.users.map((u, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td><strong style="color:#fff;">${escapeHTML(u.name || u.displayName || "—")}</strong></td>
                            <td>
                                <div style="direction:ltr;text-align:right;">
                                    ${escapeHTML(u.email || "—")}
                                    <br>
                                    <small style="color:#667182;">${escapeHTML(u.phone || "")}</small>
                                </div>
                            </td>
                            <td><span class="badge ${escapeHTML(u.role || "user")}">${escapeHTML(roleLabel(u.role))}</span></td>
                            <td>${escapeHTML(formatDate(u.createdAt))}</td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        `;
    }

    function renderRegistrations() {
        const container = byId("registrationsTable");
        if (!state.registrations.length) {
            container.innerHTML = `<div style="padding:25px;text-align:center;color:#667182;">لا توجد سجلات</div>`;
            return;
        }

        container.innerHTML = `
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الاسم</th>
                        <th>البريد</th>
                        <th>الهاتف</th>
                        <th>التاريخ</th>
                    </tr>
                </thead>
                <tbody>
                    ${state.registrations.map((r, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td>${escapeHTML(r.name || "—")}</td>
                            <td style="direction:ltr;">${escapeHTML(r.email || "—")}</td>
                            <td style="direction:ltr;">${escapeHTML(r.phone || "—")}</td>
                            <td>${escapeHTML(formatDate(r.createdAt || r.registeredAt))}</td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        `;
    }

    function renderProjects() {
        const container = byId("projectsTable");
        if (!state.projects.length) {
            container.innerHTML = `<div style="padding:25px;text-align:center;color:#667182;">لا توجد مشاريع</div>`;
            return;
        }

        container.innerHTML = `
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>المشروع</th>
                        <th>النوع</th>
                        <th>الأبعاد</th>
                        <th>آخر تعديل</th>
                    </tr>
                </thead>
                <tbody>
                    ${state.projects.map((p, i) => {
                        const room = p.room || p;
                        const w = room.width || p.width || "—";
                        const d = room.depth || room.length || p.length || "—";
                        const h = room.height || p.height || "—";
                        return `
                            <tr>
                                <td>${i + 1}</td>
                                <td><strong style="color:#fff;">${escapeHTML(p.name || p.projectName || "—")}</strong></td>
                                <td>${escapeHTML(p.project_type || p.venueType || "—")}</td>
                                <td>${w} × ${d} × ${h} m</td>
                                <td>${escapeHTML(formatDate(p.updatedAt || p.updated_at))}</td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        `;
    }

    function renderActivity() {
        const container = byId("activityList");
        if (!state.activity.length) {
            container.innerHTML = `<div style="padding:25px;text-align:center;color:#667182;">لا يوجد نشاط مسجل</div>`;
            return;
        }

        container.innerHTML = state.activity
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
            .slice(0, 50)
            .map(item => `
                <div style="padding:12px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;gap:12px;">
                    <div style="width:32px;height:32px;border-radius:8px;background:rgba(56,189,248,.1);color:#38bdf8;display:flex;align-items:center;justify-content:center;">
                        <i class="fa-solid fa-circle-info"></i>
                    </div>
                    <div style="flex:1;">
                        <strong style="color:#e6eaf0;font-size:12px;">${escapeHTML(item.description || item.message || item.action || "نشاط")}</strong>
                        <div style="color:#667182;font-size:10px;margin-top:3px;">
                            ${escapeHTML(item.userName || item.email || "")} • ${escapeHTML(formatDate(item.createdAt))}
                        </div>
                    </div>
                </div>
            `).join("");
    }

    function roleLabel(role) {
        return ({ user: "مستخدم", engineer: "مهندس", admin: "مشرف", owner: "مالك" }[role] || role || "مستخدم");
    }

    /* ===== Navigation ===== */
    function openSection(section) {
        state.currentSection = section;
        document.querySelectorAll(".admin-section").forEach(el => {
            el.classList.toggle("active", el.id === "section-" + section);
            el.style.display = el.id === "section-" + section ? "" : "none";
        });
        document.querySelectorAll(".admin-nav button").forEach(btn => {
            btn.classList.toggle("active", btn.dataset.section === section);
        });

        const titles = {
            dashboard: ["لوحة التحكم", "نظرة عامة على المنصة"],
            users: ["المستخدمون", "إدارة الحسابات والصلاحيات"],
            registrations: ["التسجيلات", "بيانات التسجيل الجديدة"],
            projects: ["المشاريع", "مشاريع التصميم الهندسي"],
            activity: ["سجل النشاط", "متابعة عمليات النظام"]
        };
        const t = titles[section] || titles.dashboard;
        byId("pageTitle").textContent = t[0];
        byId("pageSubtitle").textContent = t[1];
    }

    /* ===== Bind ===== */
    document.querySelectorAll(".admin-nav button").forEach(btn => {
        btn.addEventListener("click", () => openSection(btn.dataset.section));
    });

    byId("refreshBtn").addEventListener("click", async () => {
        await loadData();
        toast("تم تحديث البيانات");
    });

    byId("backToAppBtn").addEventListener("click", () => {
        window.location.href = "app.html";
    });

    byId("logoutBtn").addEventListener("click", async () => {
        if (!confirm("هل تريد تسجيل الخروج؟")) return;
        try { await Auth?.logout(); } catch {}
        window.location.href = "index.html";
    });

    /* ===== Protect + Init ===== */
    window.addEventListener("auth:ready", async function (e) {
        if (!e.detail?.authenticated) {
            window.location.href = "register.html";
            return;
        }

        // تحقق من الصلاحيات
        const role = Auth?.getRole?.() || "user";
        if (!["admin", "owner"].includes(role)) {
            toast("ليس لديك صلاحية الدخول");
            setTimeout(() => window.location.href = "app.html", 1500);
            return;
        }

        await loadData();
    });

    // fallback
    setTimeout(async () => {
        if (Auth?.isAuthenticated?.()) {
            const role = Auth?.getRole?.() || "user";
            if (["admin", "owner"].includes(role)) {
                await loadData();
            }
        }
    }, 1500);
})();
</script>

</body>
</html>
